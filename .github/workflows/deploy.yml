name: Deploy

on:
  push:
    branches:
      - develop
      - release
      - master

permissions:
  contents: read # Needed to check out the repository.

concurrency:
  # `github.event_name` is omitted because this workflow only fires on push, so
  # there is no second event to collide with. An in-progress publish is never
  # cancelled — doing so would leave the gem set partially pushed to RubyGems.org.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Test
    permissions:
      contents: read # Needed to check out the repository.
    uses: ./.github/workflows/tests.yml

  canary-release:
    needs: test
    if: ${{ github.ref_name == 'develop' || github.ref_name == 'release' }}
    name: Canary Release
    permissions:
      contents: read # Needed to check out the repository.
      id-token: write # Needed to exchange a GitHub OIDC token for short-lived RubyGems.org credentials.
    # The RubyGems.org trusted publisher for each gem requires the `release`
    # environment, so the OIDC token must carry that claim to be accepted.
    environment: release
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check Out Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set Up Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: "3.3"

      - name: Set Up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Bootstrap Packages
        run: rake bootstrap

      - name: Set Canary Version
        run: .github/scripts/deploy/set-version.sh "pre.$(git rev-parse --short HEAD)"

      - name: Configure RubyGems Credentials
        uses: rubygems/configure-rubygems-credentials@dc5a8d8553e6ee01fc26761a49e99e733d17954a # v2.1.0

      - name: Publish Gems
        run: rake publish

  production-release:
    needs: test
    if: ${{ github.ref_name == 'master' }}
    name: Production Release
    permissions:
      contents: read # Needed to check out the repository.
      id-token: write # Needed to exchange a GitHub OIDC token for short-lived RubyGems.org credentials.
    environment: release
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check Out Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set Up Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: "3.3"

      - name: Set Up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Bootstrap Packages
        run: rake bootstrap

      - name: Set Version
        run: .github/scripts/deploy/set-version.sh

      - name: Configure RubyGems Credentials
        uses: rubygems/configure-rubygems-credentials@dc5a8d8553e6ee01fc26761a49e99e733d17954a # v2.1.0

      - name: Publish Gems
        run: rake publish

  github-release:
    needs: production-release
    name: GitHub Release
    permissions:
      contents: read # Needed to check out the repository; the release itself uses `secrets.PAT`.
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check Out Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.PAT }}
        run: .github/scripts/deploy/create-github-release.sh
