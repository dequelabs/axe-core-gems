name: Update axe-core

on:
  schedule:
    # Run every night at midnight
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: read # Needed to check out the repository; the pull request is opened with `secrets.PAT`.
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - uses: dequelabs/axe-api-team-public/.github/actions/create-update-axe-core-pull-request-v1@644ee2aa6db0fb82ff7e332f1c2894b50bbbbe8e # main
        with:
          token: ${{ secrets.PAT }}
